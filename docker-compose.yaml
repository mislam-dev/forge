services:
  # ==========================================
  # Infrastructure Services
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  loki:
    image: grafana/loki:3.0.0
    container_name: loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"
    volumes:
      - ./docker/loki/config.yaml:/etc/loki/config.yaml
      - loki_data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 -O- http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  grafana:
    image: grafana/grafana:11.0.0
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - loki
    networks:
      - backend

  # ==========================================
  # Application Services (Profiles: dev, prod, test)
  # ==========================================

  # Development service: hot-reloading with cargo-watch, volume-mounted code & caches
  forge-dev:
    profiles: ["dev"]
    image: forge:dev
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: forge-dev
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/app_db
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_VHOST: /
      LOKI_URL: http://loki:3100
      JWT_SECRET: dev-only-change-me-in-production
      JWT_EXPIRY_SECONDS: 3600
      REFRESH_TOKEN_EXPIRY_DAYS: 7
      MASTER_ENCRYPTION_KEY: dev-only-32-byte-placeholder-key
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 9000
      RUST_LOG: debug
      RUST_BACKTRACE: 1
    ports:
      - "9000:9000"
    volumes:
      - .:/app
      - cargo_registry:/usr/local/cargo/registry
      - cargo_target_dev:/app/target
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      loki:
        condition: service_healthy
    networks:
      - backend

  # Production service: minimal multi-stage image, stripped binary, non-root user
  forge-api:
    profiles: ["prod"]
    image: forge:prod
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
    container_name: forge-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/app_db
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_VHOST: /
      LOKI_URL: http://loki:3100
      JWT_SECRET: dev-only-change-me-in-production
      JWT_EXPIRY_SECONDS: 3600
      REFRESH_TOKEN_EXPIRY_DAYS: 7
      MASTER_ENCRYPTION_KEY: dev-only-32-byte-placeholder-key
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 9000
      RUST_LOG: info
    ports:
      - "9000:9000"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      loki:
        condition: service_healthy
    networks:
      - backend

  # Testing service: Rust + Node.js + Newman with automated ulimits (nofile: 65535)
  forge-test:
    profiles: ["test"]
    image: forge:test
    build:
      context: .
      dockerfile: docker/Dockerfile.test
    container_name: forge-test
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/app_db
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_VHOST: /
      LOKI_URL: http://loki:3100
      JWT_SECRET: dev-only-change-me-in-production
      JWT_EXPIRY_SECONDS: 3600
      REFRESH_TOKEN_EXPIRY_DAYS: 7
      MASTER_ENCRYPTION_KEY: dev-only-32-byte-placeholder-key
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 9000
      RUST_LOG: info
      RUST_BACKTRACE: 1
      CI: "true"
    volumes:
      - .:/app
      - cargo_registry:/usr/local/cargo/registry
      - cargo_target_test:/app/target
      - ./reports:/app/reports
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      loki:
        condition: service_healthy
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  loki_data:
  grafana_data:
  cargo_registry:
  cargo_target_dev:
  cargo_target_test:
