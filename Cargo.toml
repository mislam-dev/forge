[package]
name = "forge"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "src/database/migrations/"]

[dependencies]
axum = "0.8.9"
bcrypt = "0.19.3"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
jsonwebtoken = {
  version = "11.0.0",
  default-features = false,
  features = ["rust_crypto"]
}
sea-orm = {
  version = "2.0.0",
  features = ["macros", "mock", "runtime-tokio-rustls", "sqlx-postgres"]
}
sea-orm-cli = "2.0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = "0.1"
tower-http = { version = "0.7.0", features = ["cors", "request-id", "timeout", "trace", "util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.24.1", features = ["serde", "v4"] }
validator = { version = "0.21.0", features = ["derive"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

[[test]]
name = "foundation_tests"
path = "tests/foundation_tests.rs"

[[test]]
name = "auth_tests"
path = "tests/auth_tests.rs"

