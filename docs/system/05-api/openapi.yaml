      summary: "Readiness probe — check dependency readiness"
      security: []
      description: "Readiness probe checking availability of core dependencies (database, job queue, container runtime) before routing traffic."
      responses:
        '200':
          description: "All critical dependencies are ready"
          content:
            application/json:
              example:
                status: "ready"
                service: "forge-platform"
                timestamp: "2026-08-12T21:00:00Z"
                checks:
                  database:
                    status: "healthy"
                    latency_ms: 4
                  job_queue:
                    status: "healthy"
                    latency_ms: 2
                  container_runtime:
                    status: "healthy"
                    latency_ms: 8
        '503':
          description: "One or more critical dependencies unavailable"
          content:
            application/json:
              example:
