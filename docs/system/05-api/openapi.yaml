          type: string
          enum:
            - "Development"
            - "Preview"
            - "Production"
        is_secret:
          type: boolean
          default: true

    TriggerDeploymentRequest:
      type: object
      required:
        - project_id
      properties:
        project_id:
          type: string
          format: uuid
        branch:
          type: string
        commit_hash:
          type: string

    DeploymentResponse:
      type: object
      properties:
        message:
          type: string
        data:
          type: object
          properties:
            id:
              type: string
              format: uuid
            project_id:
              type: string
              format: uuid
            triggered_by:
              type: string
              format: uuid
            branch:
              type: string
            commit_hash:
              type: string
            status:
              type: string
            build_duration:
              type: integer
            deploy_duration:
              type: integer
            created_at:
              type: string

    ErrorResponse:
      type: object
      properties:
        is_error:
          type: boolean
          example: true
        code:
          type: string
          example: "PRJ_PERM_002"
        message:
          type: string
          example: "Access denied. Developers can only delete projects created by themselves."
        errors:
          type: object

  responses:
    BadRequest:
      description: "Bad Request / Validation Failure"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            is_error: true
            code: "ENV_001"
            message: "Invalid Key Format. Must match POSIX ^[A-Z_][A-Z0-9_]*$"

    Unauthorized:
      description: "Authentication Required / Invalid Token"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            is_error: true
            code: "AUTH_000"
            message: "Authentication token missing or invalid"

    Forbidden:
      description: "Authorization Denied / Insufficient Privileges"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            is_error: true
            code: "PRJ_PERM_001"
            message: "Access denied. Viewers cannot perform write operations"

    NotFound:
      description: "Resource Not Found"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            is_error: true
            code: "DEPLOY_001"
            message: "Deployment record not found"

    Conflict:
      description: "Resource Conflict / Duplicate Entry"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            is_error: true
            code: "ENV_002"
            message: "Duplicate Variable Key for target environment"
