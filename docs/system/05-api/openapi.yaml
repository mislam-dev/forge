openapi: 3.0.3
info:
  title: "Forge Platform API"
  description: "Complete OpenAPI 3.0 specification for the Forge Developer Deployment & Project Management Platform."
  version: "1.0.0"
  contact:
    name: "Forge Engineering Team"
    email: "support@forge.dev"
  license:
    name: "MIT"
    url: "https://opensource.org/licenses/MIT"

servers:
  - url: "http://localhost:3000/api/v1"
    description: "Local Development Environment"
  - url: "https://api.forge.dev"
    description: "Production API Server"

tags:
  - name: Authentication
    description: "User registration, login, logout, profile identity, and token refresh"
  - name: "Access Control: Roles"
    description: "System role definitions and management (System Admin)"
  - name: "Access Control: Permissions"
    description: "Atomic system permissions management (System Admin)"
  - name: "Access Control: Role Permissions"
    description: "Mapping permissions to system roles (System Admin)"
  - name: "Access Control: User Roles"
    description: "Assigning and removing system roles for users (System Admin)"
  - name: "Access Control: User Permissions"
    description: "Direct user permission overrides and assignments (System Admin)"
  - name: Users

x-tagGroups:
  - name: Access Control
    tags:
      - "Access Control: Roles"
      - "Access Control: Permissions"
      - "Access Control: Role Permissions"
      - "Access Control: User Roles"
      - "Access Control: User Permissions"
    description: "User management and account profile configuration"
  - name: Notifications
    description: "In-app user event notifications"
  - name: Organizations
    description: "Organization lifecycle and tenant management"
  - name: Org Members
    description: "Organization member joining, role updates, and removal"
  - name: Teams
    description: "Team management within organizations"
  - name: Projects
    description: "Project creation, configuration, and lifecycle"
  - name: Repository
    description: "Git repository connections, branch management, and commit fetching"
  - name: Environment Variables
    description: "Encrypted key-value configuration per target environment"
  - name: Project Assignments
    description: "Assigning users and teams to projects"
  - name: Deployments
    description: "Triggering and tracking async deployment lifecycles"
  - name: Live Build Logs
    description: "Real-time SSE streaming and stored log retrieval"
  - name: Deployment History
    description: "Historical deployments, redeploy, and rollback operations"
  - name: Dashboard
    description: "Aggregated cross-domain platform metrics"
  - name: Health
    description: "System-wide health monitoring and probe aggregation"

paths:
  /auth/register:
    post:
      tags:
        - Authentication
      operationId: auth_register
      summary: "Register a new user account"
      security: []
      description: "Creates a new user record with hashed password and assigns default system role."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              name: "Monirul Islam"
              email: "monirul@example.com"
              password: "StrongPassword123!"
      responses:
        '201':
          description: "User created successfully"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              example:
                message: "User registered successfully."
                data:
                  id: "456e7890-e89b-12d3-a456-426614174000"
                  name: "Monirul Islam"
                  email: "monirul@example.com"
                  created_at: "2026-08-12T17:00:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /auth/login:
    post:
      tags:
        - Authentication
      operationId: auth_login
      summary: "Authenticate user credentials"
      security: []
      description: "Validates email and password, returning short-lived JWT access token and refresh token session."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: "monirul@example.com"
              password: "StrongPassword123!"
      responses:
        '200':
          description: "Authentication successful"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
              example:
                message: "Login successful."
                data:
                  access_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  refresh_token: "rfr_890a7b6c5d4e3f2a1b0c..."
                  expires_in: 900
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags:
        - Authentication
      operationId: auth_logout
      summary: "Invalidate user session"
      security:
        - bearerAuth: []
      description: "Revokes the refresh token session associated with the active token."
      responses:
        '200':
          description: "Session invalidated"
          content:
            application/json:
              example:
                message: "Logged out successfully."
                data: {}
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/refresh:
    post:
      tags:
        - Authentication
      operationId: auth_refresh_token
      summary: "Refresh JWT access token"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh_token
              properties:
                refresh_token:
                  type: string
            example:
              refresh_token: "rfr_890a7b6c5d4e3f2a1b0c..."
      responses:
        '200':
          description: "Token refreshed"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/forgot-password:
    post:
      tags:
        - Authentication
      operationId: auth_forgot_password
      summary: "Request password reset email"
      security: []
      description: "Generates a password reset token and sends it to the user's registered email. Always returns 200 to prevent user enumeration."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
            example:
              email: "monirul@example.com"
      responses:
        '200':
          description: "Reset email sent (or silently ignored if email not found)"
          content:
            application/json:
              example:
                message: "If this email is registered, a password reset link has been sent."
        '400':
          $ref: '#/components/responses/BadRequest'

  /auth/reset-password:
    post:
      tags:
        - Authentication
      operationId: auth_reset_password
      summary: "Reset password using a valid reset token"
      security: []
      description: "Validates the reset token, updates the user's password, and invalidates the token."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
            example:
              token: "rst_a1b2c3d4e5f6..."
              new_password: "NewStrongPassword456!"
              confirm_password: "NewStrongPassword456!"
      responses:
        '200':
          description: "Password reset successfully"
          content:
            application/json:
              example:
                message: "Password has been reset successfully."
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: "Reset token expired or invalid (AUTH_006)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                is_error: true
                code: "AUTH_006"
                message: "Reset token has expired or is invalid."
                errors: {}

  /auth/verify-email:
    get:
      tags:
        - Authentication
      operationId: auth_verify_email
      summary: "Verify user email address"
      security: []
      description: "Validates the email verification token sent to the user during registration. This endpoint is typically accessed by clicking a link in the verification email. Upon success, the user's account is activated."
      parameters:
        - name: token
          in: query
          required: true
          description: "Email verification token sent via registration email"
          schema:
            type: string
          example: "vrfy_a1b2c3d4e5f6g7h8..."
      responses:
        '200':
          description: "Email verified successfully — account activated"
          content:
            application/json:
              example:
                message: "Email verified successfully. Your account is now active."
        '400':
          description: "Token invalid, expired, or already used (AUTH_006/AUTH_007)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                is_error: true
                code: "AUTH_006"
                message: "Verification token has expired or is invalid."
                errors: {}

  /auth/me:
    get:
      operationId: auth_me_get
      tags:
        - Authentication
      summary: "Get authenticated user profile"
      security:
        - bearerAuth: []
      responses:
        '200':
          description: "Profile retrieved"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'

  /access-control/roles:
    get:
      operationId: access_control_roles_list
      tags:
        - "Access Control: Roles"
      summary: "List all system roles"
      security:
        - bearerAuth: []
      responses:
        '200':
          description: "List of system roles retrieved successfully"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRoleList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: access_control_roles_create
      tags:
        - "Access Control: Roles"
      summary: "Create a system role"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleCreateInput'
            example:
              key: "System Admin"
              value: "admin"
              description: "Full system administrative access"
      responses:
        '201':
          description: "Role created successfully"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRoleSingle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /access-control/roles/{id}:
    get:
      operationId: access_control_roles_show
      tags:
        - "Access Control: Roles"
      summary: "Get a system role by ID"
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: "Role retrieved successfully"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRoleSingle'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: access_control_roles_update
      tags:
        - "Access Control: Roles"
      summary: "Update a system role"
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleUpdateInput'
            example:
              key: "Updated Admin"
              value: "updated_admin"
      responses:
        '200':
          description: "Role updated successfully"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRoleSingle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: access_control_roles_remove
      tags:
        - "Access Control: Roles"
      summary: "Delete a system role"
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: "Role deleted successfully"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseNull'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /access-control/permissions:
    get:
      operationId: access_control_permissions_list
      tags:
        - "Access Control: Permissions"
      summary: "List system permissions (paginated)"
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageQueryParam'
        - $ref: '#/components/parameters/PerPageQueryParam'
      responses:
        '200':
          description: "Paginated list of system permissions retrieved successfully"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePaginatedPermissions'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: access_control_permissions_create
      tags:
        - "Access Control: Permissions"
      summary: "Create a system permission"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermissionCreateInput'
            example:
              key: "Create User"
              value: "create-user"
              descriptions: "Ability to create new users"
      responses:
        '201':
          description: "Permission created successfully"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePermissionSingle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /access-control/permissions/{id}:
    get:
      operationId: access_control_permissions_show
      tags:
        - "Access Control: Permissions"
      summary: "Get a system permission by ID"
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: "Permission retrieved successfully"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePermissionSingle'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: access_control_permissions_update
      tags:
        - "Access Control: Permissions"
      summary: "Update system permission"
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermissionUpdateInput'
            example:
              key: "Update User"
              value: "update-user"
      responses:
        '200':
          description: "Permission updated successfully"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePermissionSingle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: access_control_permissions_remove
      tags:
        - "Access Control: Permissions"
      summary: "Delete system permission"
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '204':
          description: "Permission deleted successfully"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /access-control/roles/permissions/assign:
    post:
      operationId: access_control_roles_permissions_assign
      tags:
        - "Access Control: Role Permissions"
      summary: "Assign permissions to a role"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRolePermissionsInput'
            example:
              role_id: "07c0060e-8e8c-44c1-942c-3004f5a6c5b6"
              permission_ids:
                - "18d1071f-9f9d-55d2-a53d-4115f6b7d6c7"
      responses:
        '201':
          description: "Permissions assigned to role successfully"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRolePermissionsList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /access-control/roles/permissions/remove:
    post:
      operationId: access_control_roles_permissions_remove
      tags:
        - "Access Control: Role Permissions"
      summary: "Remove permissions from a role"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveRolePermissionsInput'
            example:
              role_id: "07c0060e-8e8c-44c1-942c-3004f5a6c5b6"
              permission_ids:
                - "18d1071f-9f9d-55d2-a53d-4115f6b7d6c7"
      responses:
        '204':
          description: "Permissions removed from role successfully"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /access-control/roles/permissions/{id}:
    get:
      operationId: access_control_roles_permissions_show
      tags:
        - "Access Control: Role Permissions"
      summary: "Get permissions assigned to a role (paginated)"
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/PageQueryParam'
        - $ref: '#/components/parameters/PerPageQueryParam'
      responses:
        '200':
          description: "Role permissions list retrieved successfully"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePaginatedPermissions'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /access-control/role/assign:
    post:
      operationId: access_control_user_roles_assign
      tags:
        - "Access Control: User Roles"
      summary: "Assign system roles to a user"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignUserRolesInput'
            example:
              user_id: "456e7890-e89b-12d3-a456-426614174000"
              role_ids:
                - "07c0060e-8e8c-44c1-942c-3004f5a6c5b6"
      responses:
        '201':
          description: "Roles assigned to user successfully"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUserRolesList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /access-control/role/remove:
    post:
      operationId: access_control_user_roles_remove
      tags:
        - "Access Control: User Roles"
      summary: "Remove system roles from a user"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveUserRolesInput'
            example:
              user_id: "456e7890-e89b-12d3-a456-426614174000"
              role_ids:
                - "07c0060e-8e8c-44c1-942c-3004f5a6c5b6"
      responses:
        '204':
          description: "Roles removed from user successfully"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /access-control/role/user/{id}:
    get:
      operationId: access_control_user_roles_show
      tags:
        - "Access Control: User Roles"
      summary: "Get system roles assigned to a user"
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: "User system roles retrieved successfully"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRoleList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /access-control/users/permission/assign:
    post:
      operationId: access_control_user_permissions_assign
      tags:
        - "Access Control: User Permissions"
      summary: "Assign direct permissions to a user"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignUserPermissionsInput'
            example:
              user_id: "456e7890-e89b-12d3-a456-426614174000"
              permission_ids:
                - "18d1071f-9f9d-55d2-a53d-4115f6b7d6c7"
      responses:
        '201':
          description: "Direct permissions assigned to user successfully"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUserPermissionsList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /access-control/users/permission/remove:
    post:
      operationId: access_control_user_permissions_remove
      tags:
        - "Access Control: User Permissions"
      summary: "Remove direct permissions from a user"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveUserPermissionsInput'
            example:
              user_id: "456e7890-e89b-12d3-a456-426614174000"
              permission_ids:
                - "18d1071f-9f9d-55d2-a53d-4115f6b7d6c7"
      responses:
        '204':
          description: "Direct permissions removed from user successfully"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /access-control/users/permissions/{id}:
    get:
      operationId: access_control_user_permissions_show
      tags:
        - "Access Control: User Permissions"
      summary: "Get direct permissions assigned to a user"
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: "User direct permissions list retrieved successfully"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePermissionList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /users:
    get:
      operationId: users_get
      tags:
        - Users
      summary: "List all platform users (System Admin)"
      security:
        - bearerAuth: []
      responses:
        '200':
          description: "Paginated users list"
          content:
            application/json:
              example:
                message: "Users retrieved successfully."
                data:
                  - id: "456e7890-e89b-12d3-a456-426614174000"
                    name: "Monirul Islam"
                    email: "monirul@example.com"
                    created_at: "2026-08-12T17:00:00Z"
        '403':
          $ref: '#/components/responses/Forbidden'

  /users/{id}:
    get:
      operationId: users_id_get
      tags:
        - Users
      summary: "Get user account details"
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: "User account details"
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: users_id_put
