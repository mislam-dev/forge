$kind: http-example
request:
  url: "{{baseUrl}}/health/deep?timeout_ms=3000"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    timeout_ms: "3000"
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "healthy",
        "service": "forge-platform",
        "version": "1.0.0",
        "environment": "production",
        "uptime_seconds": 864000,
        "timestamp": "2026-08-12T21:00:00Z"
      }
order: 1000
