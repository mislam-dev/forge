$kind: http-request
description: Aggregated deep operational health check evaluating all internal modules and external integrations. Restricted to System Admin.
url: "{{baseUrl}}/health/deep?timeout_ms=3000"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: timeout_ms
    value: "3000"
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "integer",
            "default": 3000
          }
        }
      }
body:
  type: text
  content: ""
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Response status code is 200 OK, 401 Unauthorized, or 403 Forbidden", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 401, 403]);
      });

      pm.test("Response Content-Type is application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      let json_data;
      try {
          json_data = pm.response.json();
      } catch (e) {
          pm.expect.fail("Response body is not valid JSON");
      }

      if (pm.response.code === 200) {
          pm.test("Deep health diagnostic report conforms to contract schema", function () {
              pm.expect(json_data).to.be.an("object");
              pm.expect(json_data.status).to.equal("healthy");
              pm.expect(json_data.service).to.equal("forge-platform");
              pm.expect(json_data.version).to.be.a("string").and.not.be.empty;
              pm.expect(json_data.environment).to.be.a("string").and.not.be.empty;
              pm.expect(json_data.uptime_seconds).to.be.a("number").and.at.least(0);
              pm.expect(json_data.timestamp).to.be.a("string");
              pm.expect(isNaN(Date.parse(json_data.timestamp))).to.be.false;
          });
      } else {
          pm.test("Unauthorized or forbidden response conforms to ErrorResponse schema", function () {
              pm.expect(json_data).to.be.an("object");
              pm.expect(json_data.is_error).to.be.true;
              pm.expect(json_data.code).to.be.a("string").and.not.be.empty;
              pm.expect(json_data.message).to.be.a("string").and.not.be.empty;
          });
      }
    language: text/javascript
settings: {}
examples: ./.resources/Deep health check — all internal services and dependencies.resources/examples
order: 1000
