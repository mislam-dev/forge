$kind: http-request
description: Lightweight liveness probe for load balancers and orchestrators to check if the application process is alive.
url: "{{baseUrl}}/health/live"
method: GET
headers:
  Accept: application/json
body:
  type: text
  content: ""
scripts:
  - type: afterResponse
    code: |-
      pm.test("Response status code is 200 OK", function () {
          pm.expect(pm.response.code).to.equal(200);
      });

      pm.test("Response Content-Type is application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      let json_data;
      try {
          json_data = pm.response.json();
      } catch (e) {
          pm.expect.fail("Response body is not valid JSON");
      }

      pm.test("Liveness probe response conforms to contract schema", function () {
          pm.expect(json_data).to.be.an("object");
          pm.expect(json_data.status).to.equal("healthy");
          pm.expect(json_data.service).to.equal("forge-platform");
          pm.expect(json_data.version).to.be.a("string").and.not.be.empty;
          pm.expect(json_data.environment).to.be.a("string").and.not.be.empty;
          pm.expect(json_data.timestamp).to.be.a("string");
          pm.expect(isNaN(Date.parse(json_data.timestamp))).to.be.false;
      });
    language: text/javascript
settings: {}
examples: ./.resources/Liveness probe — check process health.resources/examples
order: 1000
