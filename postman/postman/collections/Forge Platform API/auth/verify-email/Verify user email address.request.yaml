$kind: http-request
description: Validates the email verification token sent to the user during registration. This endpoint is typically accessed by clicking a link in the verification email. Upon success, the user's account is activated.
url: "{{baseUrl}}/auth/verify-email?token=vrfy_a1b2c3d4e5f6g7h8..."
method: GET
headers:
  Accept: application/json
queryParams:
  - key: token
    value: vrfy_a1b2c3d4e5f6g7h8...
    disabled: false
    description: Email verification token sent via registration email
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: text
  content: ""
scripts:
  - type: afterResponse
    code: |-
      pm.test("Response status code is 200 OK or 400 Bad Request", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 400]);
      });

      pm.test("Response Content-Type is application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      let json_data;
      try {
          json_data = pm.response.json();
      } catch (e) {
          pm.expect.fail("Response body is not valid JSON");
      }

      if (pm.response.code === 200) {
          pm.test("Success response contains activation confirmation", function () {
              pm.expect(json_data).to.have.property("message");
              pm.expect(json_data.message).to.be.a("string");
          });
      } else {
          pm.test("Error response conforms to ErrorResponse schema", function () {
              pm.expect(json_data.is_error).to.be.true;
              pm.expect(json_data.code).to.be.a("string");
              pm.expect(json_data.message).to.be.a("string");
          });
      }
    language: text/javascript
settings: {}
examples: ./.resources/Verify user email address.resources/examples
order: 1000
