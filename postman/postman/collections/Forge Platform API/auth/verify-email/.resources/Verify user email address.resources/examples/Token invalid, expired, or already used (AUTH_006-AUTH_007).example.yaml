$kind: http-example
name: Token invalid, expired, or already used (AUTH_006/AUTH_007)
request:
  url: "{{baseUrl}}/auth/verify-email?token=vrfy_a1b2c3d4e5f6g7h8..."
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: token
      value: vrfy_a1b2c3d4e5f6g7h8...
      disabled: false
      description: Email verification token sent via registration email
  body:
    type: text
    content: ""
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "is_error": true,
        "code": "AUTH_006",
        "message": "Verification token has expired or is invalid.",
        "errors": {}
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "is_error": {
            "type": "boolean",
            "example": true
          },
          "code": {
            "type": "string",
            "example": "PRJ_PERM_002"
          },
          "message": {
            "type": "string",
            "example": "Access denied. Developers can only delete projects created by themselves."
          },
          "errors": {
            "type": "object"
          }
        }
      }
order: 2000
