$kind: http-request
description: ""
url: "{{baseUrl}}/auth/refresh"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "refresh_token": "rfr_890a7b6c5d4e3f2a1b0c..."
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "refresh_token": {
          "type": "string"
        }
      },
      "required": [
        "refresh_token"
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Response status code is 200 OK or 401 Unauthorized", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 401]);
      });

      pm.test("Response Content-Type is application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      let json_data;
      try {
          json_data = pm.response.json();
      } catch (e) {
          pm.expect.fail("Response body is not valid JSON");
      }

      if (pm.response.code === 200) {
          pm.test("Success response conforms to AuthTokenResponse schema", function () {
              pm.expect(json_data).to.have.property("data");
              pm.expect(json_data.data).to.be.an("object");
              pm.expect(json_data.data).to.have.property("access_token");
              pm.expect(json_data.data).to.have.property("refresh_token");
          });

          let access_token = json_data.data.access_token;
          let refresh_token = json_data.data.refresh_token;
          if (access_token) {
              pm.environment.set("bearerToken", access_token);
          }
          if (refresh_token) {
              pm.environment.set("refreshToken", refresh_token);
          }
      } else {
          pm.test("Error response conforms to ErrorResponse schema", function () {
              pm.expect(json_data.is_error).to.be.true;
              pm.expect(json_data.code).to.be.a("string");
              pm.expect(json_data.message).to.be.a("string");
          });
      }
    language: text/javascript
settings: {}
examples: ./.resources/Refresh JWT access token.resources/examples
order: 1000
