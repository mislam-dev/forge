$kind: http-request
description: Generates a password reset token and sends it to the user's registered email. Always returns 200 to prevent user enumeration.
url: "{{baseUrl}}/auth/forgot-password"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "email": "monirul@example.com"
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "email": {
          "type": "string",
          "format": "email"
        }
      },
      "required": [
        "email"
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Response status code is 200 OK or 400 Bad Request", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 400]);
      });

      pm.test("Response Content-Type is application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      let json_data;
      try {
          json_data = pm.response.json();
      } catch (e) {
          pm.expect.fail("Response body is not valid JSON");
      }

      if (pm.response.code === 200) {
          pm.test("Success response contains confirmation message", function () {
              pm.expect(json_data).to.have.property("message");
              pm.expect(json_data.message).to.be.a("string");
          });
      } else {
          pm.test("Error response conforms to ErrorResponse schema", function () {
              pm.expect(json_data.is_error).to.be.true;
              pm.expect(json_data.code).to.be.a("string");
              pm.expect(json_data.message).to.be.a("string");
          });
      }
    language: text/javascript
settings: {}
examples: ./.resources/Request password reset email.resources/examples
order: 1000
