$kind: http-example
request:
  url: "{{baseUrl}}/auth/forgot-password"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "email": "monirul@example.com"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "If this email is registered, a password reset link has been sent."
      }
order: 1000
