$kind: http-request
description: Validates the reset token, updates the user's password, and invalidates the token.
url: "{{baseUrl}}/auth/reset-password"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "token": "rst_a1b2c3d4e5f6...",
      "new_password": "NewStrongPassword456!",
      "confirm_password": "NewStrongPassword456!"
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "token": {
          "type": "string"
        },
        "new_password": {
          "type": "string",
          "minLength": 8
        },
        "confirm_password": {
          "type": "string"
        }
      },
      "required": [
        "token",
        "new_password",
        "confirm_password"
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Response status code is 200 OK or error (400/401)", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 400, 401]);
      });

      pm.test("Response Content-Type is application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      let json_data;
      try {
          json_data = pm.response.json();
      } catch (e) {
          pm.expect.fail("Response body is not valid JSON");
      }

      if (pm.response.code === 200) {
          pm.test("Success response contains password reset confirmation", function () {
              pm.expect(json_data).to.have.property("message");
              pm.expect(json_data.message).to.be.a("string");
          });
      } else {
          pm.test("Error response conforms to ErrorResponse schema", function () {
              pm.expect(json_data.is_error).to.be.true;
              pm.expect(json_data.code).to.be.a("string");
              pm.expect(json_data.message).to.be.a("string");
          });
      }
    language: text/javascript
settings: {}
examples: ./.resources/Reset password using a valid reset token.resources/examples
order: 1000
