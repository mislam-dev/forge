$kind: http-request
description: Validates the reset token, updates the user's password, and invalidates the token.
url: "{{baseUrl}}/auth/reset-password"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "token": "rst_a1b2c3d4e5f6...",
      "new_password": "NewStrongPassword456!",
      "confirm_password": "NewStrongPassword456!"
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "token": {
          "type": "string"
        },
        "new_password": {
          "type": "string",
          "minLength": 8
        },
        "confirm_password": {
          "type": "string"
        }
      },
      "required": [
        "token",
        "new_password",
        "confirm_password"
      ]
    }
settings: {}
examples: ./.resources/Reset password using a valid reset token.resources/examples
order: 1000
