$kind: http-request
description: Creates a new user record with hashed password and assigns default system role.
url: "{{baseUrl}}/auth/register"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "name": "Monirul Islam",
      "email": "monirul@example.com",
      "password": "StrongPassword123!"
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "name": {
          "type": "string"
        },
        "email": {
          "type": "string",
          "format": "email"
        },
        "password": {
          "type": "string",
          "minLength": 8
        }
      },
      "required": [
        "name",
        "email",
        "password"
      ]
    }
settings: {}
examples: ./.resources/Register a new user account.resources/examples
order: 1000
