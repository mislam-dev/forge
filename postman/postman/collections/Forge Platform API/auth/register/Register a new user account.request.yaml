$kind: http-request
description: Creates a new user record with hashed password and assigns default system role.
url: "{{baseUrl}}/auth/register"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "name": "Monirul Islam",
      "email": "monirul@example.com",
      "password": "StrongPassword123!"
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "name": {
          "type": "string"
        },
        "email": {
          "type": "string",
          "format": "email"
        },
        "password": {
          "type": "string",
          "minLength": 8
        }
      },
      "required": [
        "name",
        "email",
        "password"
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Response status code is 201 Created or client error (400/409)", function () {
          pm.expect(pm.response.code).to.be.oneOf([201, 400, 409]);
      });

      pm.test("Response Content-Type is application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      let json_data;
      try {
          json_data = pm.response.json();
      } catch (e) {
          pm.expect.fail("Response body is not valid JSON");
      }

      if (pm.response.code === 201) {
          pm.test("Success response conforms to UserResponse schema", function () {
              pm.expect(json_data).to.have.property("message");
              pm.expect(json_data).to.have.property("data");
              pm.expect(json_data.data).to.be.an("object");
              pm.expect(json_data.data).to.have.property("id");
              pm.expect(json_data.data).to.have.property("email");
              pm.expect(json_data.data).to.have.property("name");
          });
      } else {
          pm.test("Error response conforms to ErrorResponse schema", function () {
              pm.expect(json_data.is_error).to.be.true;
              pm.expect(json_data.code).to.be.a("string");
              pm.expect(json_data.message).to.be.a("string");
          });
      }
    language: text/javascript
settings: {}
examples: ./.resources/Register a new user account.resources/examples
order: 1000
