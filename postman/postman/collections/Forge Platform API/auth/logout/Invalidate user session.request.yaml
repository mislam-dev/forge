$kind: http-request
description: Revokes the refresh token session associated with the active token.
url: "{{baseUrl}}/auth/logout"
method: POST
headers:
  Accept: application/json
body:
  type: text
  content: ""
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Invalidate user session.resources/examples
order: 1000
