$kind: http-request
description: Validates email and password, returning short-lived JWT access token and refresh token session.
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "email": "admin1@forge.local",
      "password": "Password123!"
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "email": {
          "type": "string",
          "format": "email"
        },
        "password": {
          "type": "string"
        }
      },
      "required": [
        "email",
        "password"
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      let json_data = pm.response.json();
      let access_token = json_data.data.access_token;
      let refresh_token = json_data.data.refresh_token;

      pm.environment.set("bearerToken", access_token);
      pm.environment.set("refreshToken", refresh_token);
    language: text/javascript
settings: {}
examples: ./.resources/Authenticate user credentials.resources/examples
order: 1000
