$kind: http-request
description: ""
url: "{{baseUrl}}/projects"
method: POST
headers:
  - key: Organization-ID
    value: "{{organization_id}}"
    disabled: false
    description: Organization UUID optionally provided in the header for tenant-scoped role-based authorization and context
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "format": "uuid"
          }
        }
      }
  - key: Accept
    value: application/json
    disabled: false
  - key: Content-Type
    value: application/json
    disabled: false
    description: ""
body:
  type: json
  content: |-
    {
        "name": "Forge Backend 2",
        "type": "repo",
        "health_check_url": "/health",
        "runtime": "NodeJs",
        "description": "Main Rust API backend service",
        "project_type": "Files", 
        "port": 4000
    }
  $type: |-
    {
        "type": "object",
        "properties": {
            "organization_id": {
                "type": "string",
                "description": "Optional UUID of the parent organization. If omitted/null, project is created in the user's Personal Workspace.",
                "format": "uuid"
            },
            "name": {
                "type": "string"
            },
            "type": {
                "type": "string",
                "enum": [
                    "repo",
                    "files"
                ]
            },
            "repository_url": {
                "type": "string"
            },
            "default_branch": {
                "type": "string"
            },
            "runtime": {
                "type": "string",
                "enum": [
                    "Node.js",
                    "Rust",
                    "Python",
                    "Go",
                    "Static Site"
                ]
            },
            "framework": {
                "type": "string"
            },
            "descriptions": {
                "type": "string"
            }
        },
        "required": [
            "name",
            "type",
            "runtime"
        ]
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Response status code is 201 Created or client error (400/401/403/409)", function () {
          pm.expect(pm.response.code).to.be.oneOf([201, 400, 401, 403, 409]);
      });

      pm.test("Response Content-Type is application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      let json_data;
      try {
          json_data = pm.response.json();
      } catch (e) {
          pm.expect.fail("Response body is not valid JSON");
      }

      if (pm.response.code === 201) {
          pm.test("Success response conforms to ProjectResponse schema", function () {
              pm.expect(json_data).to.have.property("data");
              pm.expect(json_data.data).to.be.an("object");
              pm.expect(json_data.data).to.have.property("id");
              pm.expect(json_data.data).to.have.property("name");
              pm.expect(json_data.data).to.have.property("created_at");
          });

          if (json_data.data && json_data.data.id) {
              pm.environment.set("project_id", json_data.data.id);
          }
      } else {
          pm.test("Error response conforms to ErrorResponse schema", function () {
              pm.expect(json_data.is_error).to.be.true;
              pm.expect(json_data.code).to.be.a("string");
              pm.expect(json_data.message).to.be.a("string");
          });
      }
    language: text/javascript
settings: {}
examples: ./.resources/Create a project.resources/examples
order: 2000
