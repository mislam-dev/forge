$kind: http-request
description: ""
url: "{{baseUrl}}/projects"
method: POST
headers:
  - key: Organization-ID
    value: "{{organization_id}}"
    disabled: false
    description: Organization UUID optionally provided in the header for tenant-scoped role-based authorization and context
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "format": "uuid"
          }
        }
      }
  - key: Accept
    value: application/json
    disabled: false
  - key: Content-Type
    value: application/json
    disabled: false
    description: ""
body:
  type: json
  content: |-
    {
        "name": "Forge Backend 2",
        "type": "repo",
        "health_check_url": "/health",
        "runtime": "NodeJs",
        "description": "Main Rust API backend service",
        "project_type": "Files", 
        "port": 4000
    }
  $type: |-
    {
        "type": "object",
        "properties": {
            "organization_id": {
                "type": "string",
                "description": "Optional UUID of the parent organization. If omitted/null, project is created in the user's Personal Workspace.",
                "format": "uuid"
            },
            "name": {
                "type": "string"
            },
            "type": {
                "type": "string",
                "enum": [
                    "repo",
                    "files"
                ]
            },
            "repository_url": {
                "type": "string"
            },
            "default_branch": {
                "type": "string"
            },
            "runtime": {
                "type": "string",
                "enum": [
                    "Node.js",
                    "Rust",
                    "Python",
                    "Go",
                    "Static Site"
                ]
            },
            "framework": {
                "type": "string"
            },
            "descriptions": {
                "type": "string"
            }
        },
        "required": [
            "name",
            "type",
            "runtime"
        ]
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Create a project.resources/examples
order: 2000
