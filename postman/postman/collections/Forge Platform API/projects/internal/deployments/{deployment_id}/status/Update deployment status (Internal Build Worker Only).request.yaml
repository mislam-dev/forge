$kind: http-request
description: ""
url: "{{baseUrl}}/projects/internal/deployments/:deployment_id/status"
method: PUT
headers:
  - key: x-service-token
    value: string
    disabled: false
    description: Master service secret key for internal worker authentication
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string"
          }
        },
        "required": [
          "value"
        ]
      }
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
pathVariables:
  - key: deployment_id
    value: a1b2c3d4-e89b-12d3-a456-426614174000
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "format": "uuid"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: json
  content: |-
    {
      "status": "Queued",
      "build_duration": 45,
      "deploy_duration": 12,
      "error_message": null
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "status": {
          "type": "string",
          "enum": [
            "Queued",
            "Building",
            "Deploying",
            "Running",
            "Failed",
            "Success"
          ],
          "example": "Queued"
        },
        "build_duration": {
          "type": "integer",
          "example": 45
        },
        "deploy_duration": {
          "type": "integer",
          "example": 12
        },
        "error_message": {
          "type": "string",
          "example": null
        }
      },
      "required": [
        "status"
      ]
    }
auth:
  type: apikey
  credentials:
    key: x-service-token
    value: "{{apiKey}}"
    in: header
scripts:
  - type: afterResponse
    code: |-
      pm.test("Response status code is 200 OK or client error (400/401/403/404)", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 400, 401, 403, 404]);
      });

      pm.test("Response Content-Type is application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      let json_data;
      try {
          json_data = pm.response.json();
      } catch (e) {
          pm.expect.fail("Response body is not valid JSON");
      }

      if (pm.response.code === 200) {
          pm.test("Success response confirms status update", function () {
              pm.expect(json_data).to.have.property("data");
              pm.expect(json_data.data).to.be.an("object");
              pm.expect(json_data.data).to.have.property("status");
          });
      } else {
          pm.test("Error response conforms to ErrorResponse schema", function () {
              pm.expect(json_data.is_error).to.be.true;
              pm.expect(json_data.code).to.be.a("string");
              pm.expect(json_data.message).to.be.a("string");
          });
      }
    language: text/javascript
settings: {}
examples: ./.resources/Update deployment status (Internal Build Worker Only).resources/examples
order: 1000
