$kind: http-request
description: ""
url: "{{baseUrl}}/projects/:id/deployments?page=1&limit=20&status=Queued&branch=string"
method: GET
headers:
  - key: Organization-ID
    value: "{{organization_id}}"
    disabled: false
    description: Organization UUID optionally provided in the header for tenant-scoped role-based authorization and context
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "format": "uuid"
          }
        }
      }
  - key: Accept
    value: application/json
queryParams:
  - key: page
    value: "1"
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "integer",
            "default": 1
          }
        }
      }
  - key: limit
    value: "20"
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "integer",
            "default": 20
          }
        }
      }
  - key: status
    value: Queued
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "enum": [
              "Queued",
              "Building",
              "Deploying",
              "Running",
              "Failed",
              "Success"
            ],
            "example": "Queued"
          }
        }
      }
  - key: branch
    value: string
    disabled: false
    description: ""
    $type: string
pathVariables:
  - key: id
    value: 07c0060e-8e8c-44c1-942c-3004f5a6c5b6
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "format": "uuid"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: text
  content: ""
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Response status code is 200 OK or client error (400/401/403/404)", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 400, 401, 403, 404]);
      });

      pm.test("Response Content-Type is application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      let json_data;
      try {
          json_data = pm.response.json();
      } catch (e) {
          pm.expect.fail("Response body is not valid JSON");
      }

      if (pm.response.code === 200) {
          pm.test("Success response contains paginated deployment history", function () {
              pm.expect(json_data).to.have.property("data");
          });
      } else {
          pm.test("Error response conforms to ErrorResponse schema", function () {
              pm.expect(json_data.is_error).to.be.true;
              pm.expect(json_data.code).to.be.a("string");
              pm.expect(json_data.message).to.be.a("string");
          });
      }
    language: text/javascript
settings: {}
examples: ./.resources/List deployment history for a project.resources/examples
order: 2000
