$kind: http-request
description: ""
url: "{{baseUrl}}/projects/:id/deployments/:deployment_id/logs/download"
method: GET
headers:
  - key: Organization-ID
    value: "{{organization_id}}"
    disabled: false
    description: Organization UUID optionally provided in the header for tenant-scoped role-based authorization and context
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "format": "uuid"
          }
        }
      }
  - key: Accept
    value: text/plain
pathVariables:
  - key: id
    value: 07c0060e-8e8c-44c1-942c-3004f5a6c5b6
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "format": "uuid"
          }
        },
        "required": [
          "value"
        ]
      }
  - key: deployment_id
    value: a1b2c3d4-e89b-12d3-a456-426614174000
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "format": "uuid"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: text
  content: ""
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Response status code is 200 OK or client error (401/403/404)", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 401, 403, 404]);
      });

      if (pm.response.code === 200) {
          pm.test("Response Content-Type is text/plain or octet-stream", function () {
              let contentType = pm.response.headers.get("Content-Type") || "";
              pm.expect(contentType).to.match(/text\/plain|application\/octet-stream/);
          });
      } else {
          pm.test("Error response Content-Type is application/json", function () {
              pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
          });

          let json_data;
          try {
              json_data = pm.response.json();
          } catch (e) {
              pm.expect.fail("Response body is not valid JSON");
          }

          pm.test("Error response conforms to ErrorResponse schema", function () {
              pm.expect(json_data.is_error).to.be.true;
              pm.expect(json_data.code).to.be.a("string");
              pm.expect(json_data.message).to.be.a("string");
          });
      }
    language: text/javascript
settings: {}
examples: ./.resources/Download complete deployment log file.resources/examples
order: 1000
