$kind: http-request
description: Updates repository URL, access token, or default branch.
url: "{{baseUrl}}/projects/:id/repository"
method: PATCH
headers:
  - key: Organization-ID
    value: "{{organization_id}}"
    disabled: false
    description: Organization UUID optionally provided in the header for tenant-scoped role-based authorization and context
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "format": "uuid"
          }
        }
      }
  - key: x-request-id
    value: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
    disabled: false
    description: Optional unique request correlation ID for tracing and debugging across middleware
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "format": "uuid"
          }
        }
      }
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
pathVariables:
  - key: id
    value: 07c0060e-8e8c-44c1-942c-3004f5a6c5b6
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "format": "uuid"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: json
  content: |-
    {
      "repository_url": "https://github.com/mislam-dev/forge.git",
      "access_token": "github_pat_11ABCXYZ123456789",
      "default_branch": "main"
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "repository_url": {
          "type": "string",
          "minLength": 5,
          "example": "https://github.com/mislam-dev/forge.git"
        },
        "access_token": {
          "type": "string",
          "example": "github_pat_11ABCXYZ123456789"
        },
        "default_branch": {
          "type": "string",
          "example": "main"
        }
      }
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Response status code is 200 OK or client error (400/401/403/404)", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 400, 401, 403, 404]);
      });

      pm.test("Response Content-Type is application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      let json_data;
      try {
          json_data = pm.response.json();
      } catch (e) {
          pm.expect.fail("Response body is not valid JSON");
      }

      if (pm.response.code === 200) {
          pm.test("Success response conforms to ProjectRepositoryResponse schema", function () {
              pm.expect(json_data).to.have.property("data");
              pm.expect(json_data.data).to.be.an("object");
              pm.expect(json_data.data).to.have.property("id");
              pm.expect(json_data.data).to.have.property("project_id");
          });
      } else {
          pm.test("Error response conforms to ErrorResponse schema", function () {
              pm.expect(json_data.is_error).to.be.true;
              pm.expect(json_data.code).to.be.a("string");
              pm.expect(json_data.message).to.be.a("string");
          });
      }
    language: text/javascript
settings: {}
examples: ./.resources/Update connected repository configuration.resources/examples
order: 3000
