$kind: http-request
description: Disconnects the Git repository from the project, clears the stored access token, and sets status to disconnected.
url: "{{baseUrl}}/projects/:id/repository"
method: DELETE
headers:
  - key: Organization-ID
    value: "{{organization_id}}"
    disabled: false
    description: Organization UUID optionally provided in the header for tenant-scoped role-based authorization and context
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "format": "uuid"
          }
        }
      }
  - key: x-request-id
    value: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
    disabled: false
    description: Optional unique request correlation ID for tracing and debugging across middleware
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "format": "uuid"
          }
        }
      }
  - key: Accept
    value: application/json
pathVariables:
  - key: id
    value: 07c0060e-8e8c-44c1-942c-3004f5a6c5b6
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "format": "uuid"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: text
  content: ""
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Disconnect repository from project.resources/examples
order: 4000
