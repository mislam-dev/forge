$kind: http-request
description: Creates a single environment variable within the specified environment.
url: "{{baseUrl}}/projects/:id/env-vars"
method: POST
headers:
  - key: Organization-ID
    value: "{{organization_id}}"
    disabled: false
    description: Organization UUID optionally provided in the header for tenant-scoped role-based authorization and context
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "format": "uuid"
          }
        }
      }
  - key: x-request-id
    value: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
    disabled: false
    description: Optional unique request correlation ID for tracing and debugging across middleware
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "format": "uuid"
          }
        }
      }
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
pathVariables:
  - key: id
    value: 07c0060e-8e8c-44c1-942c-3004f5a6c5b6
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "format": "uuid"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: json
  content: |-
    {
      "key": "DATABASE_URL",
      "value": "postgres://user:pass@localhost:5432/db",
      "environment": "development",
      "is_secret": false
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "key": {
          "type": "string",
          "minLength": 1,
          "maxLength": 255,
          "pattern": "^[A-Z_][A-Z0-9_]*$",
          "example": "DATABASE_URL"
        },
        "value": {
          "type": "string",
          "example": "postgres://user:pass@localhost:5432/db"
        },
        "environment": {
          "type": "string",
          "enum": [
            "development",
            "staging",
            "production"
          ],
          "example": "development"
        },
        "is_secret": {
          "type": "boolean",
          "example": false
        }
      },
      "required": [
        "key",
        "value",
        "environment"
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Response status code is 201 Created or client error (400/401/403/404/409)", function () {
          pm.expect(pm.response.code).to.be.oneOf([201, 400, 401, 403, 404, 409]);
      });

      pm.test("Response Content-Type is application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      let json_data;
      try {
          json_data = pm.response.json();
      } catch (e) {
          pm.expect.fail("Response body is not valid JSON");
      }

      if (pm.response.code === 201) {
          pm.test("Success response conforms to ProjectEnvironmentVariableResponse schema", function () {
              pm.expect(json_data).to.have.property("data");
              pm.expect(json_data.data).to.be.an("object");
              pm.expect(json_data.data).to.have.property("id");
              pm.expect(json_data.data).to.have.property("project_id");
              pm.expect(json_data.data).to.have.property("key");
              pm.expect(json_data.data).to.have.property("environment");
          });

          if (json_data.data && json_data.data.id) {
              pm.environment.set("env_id", json_data.data.id);
          }
      } else {
          pm.test("Error response conforms to ErrorResponse schema", function () {
              pm.expect(json_data.is_error).to.be.true;
              pm.expect(json_data.code).to.be.a("string");
              pm.expect(json_data.message).to.be.a("string");
          });
      }
    language: text/javascript
settings: {}
examples: ./.resources/Create an environment variable.resources/examples
order: 2000
