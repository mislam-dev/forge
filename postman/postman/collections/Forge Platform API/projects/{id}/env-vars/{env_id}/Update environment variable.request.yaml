$kind: http-request
description: Partially updates an existing environment variable's value or secrecy status.
url: "{{baseUrl}}/projects/:id/env-vars/:env_id"
method: PATCH
headers:
  - key: Organization-ID
    value: "{{organization_id}}"
    disabled: false
    description: Organization UUID optionally provided in the header for tenant-scoped role-based authorization and context
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "format": "uuid"
          }
        }
      }
  - key: x-request-id
    value: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
    disabled: false
    description: Optional unique request correlation ID for tracing and debugging across middleware
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "format": "uuid"
          }
        }
      }
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
pathVariables:
  - key: id
    value: 07c0060e-8e8c-44c1-942c-3004f5a6c5b6
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "format": "uuid"
          }
        },
        "required": [
          "value"
        ]
      }
  - key: env_id
    value: 1a11e467-74ee-e84f-4cb0-e1363101656f
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "format": "uuid"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: json
  content: |-
    {
      "value": "new_secret_value",
      "is_secret": true
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "value": {
          "type": "string",
          "example": "new_secret_value"
        },
        "is_secret": {
          "type": "boolean",
          "example": true
        }
      }
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Update environment variable.resources/examples
