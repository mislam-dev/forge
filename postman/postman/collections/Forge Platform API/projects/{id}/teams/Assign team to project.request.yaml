$kind: http-request
description: ""
url: "{{baseUrl}}/projects/:id/teams"
method: POST
headers:
  - key: Organization-ID
    value: "{{organization_id}}"
    disabled: false
    description: Organization UUID optionally provided in the header for tenant-scoped role-based authorization and context
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "format": "uuid"
          }
        }
      }
  - key: Content-Type
    value: application/json
pathVariables:
  - key: id
    value: 07c0060e-8e8c-44c1-942c-3004f5a6c5b6
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "format": "uuid"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: json
  content: |-
    {
      "team_id": "987f6543-e21b-32d1-b654-987654321000"
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "team_id": {
          "type": "string",
          "format": "uuid"
        }
      },
      "required": [
        "team_id"
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Response status code is 201 Created or client error (400/401/403/404/409)", function () {
          pm.expect(pm.response.code).to.be.oneOf([201, 400, 401, 403, 404, 409]);
      });

      pm.test("Response Content-Type is application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      let json_data;
      try {
          json_data = pm.response.json();
      } catch (e) {
          pm.expect.fail("Response body is not valid JSON");
      }

      if (pm.response.code === 201) {
          pm.test("Success response confirms team assignment", function () {
              pm.expect(json_data).to.have.property("data");
              pm.expect(json_data.data).to.be.an("object");
              pm.expect(json_data.data).to.have.property("team_id");
              pm.expect(json_data.data).to.have.property("project_id");
          });
      } else {
          pm.test("Error response conforms to ErrorResponse schema", function () {
              pm.expect(json_data.is_error).to.be.true;
              pm.expect(json_data.code).to.be.a("string");
              pm.expect(json_data.message).to.be.a("string");
          });
      }
    language: text/javascript
settings: {}
examples: ./.resources/Assign team to project.resources/examples
order: 2000
