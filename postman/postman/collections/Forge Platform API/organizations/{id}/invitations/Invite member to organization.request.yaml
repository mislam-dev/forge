$kind: http-request
description: ""
url: "{{baseUrl}}/organizations/:id/invitations"
method: POST
headers:
  - key: Organization-ID
    value: "{{organization_id}}"
    disabled: false
    description: Organization UUID required in the header for tenant-scoped role-based authorization
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "format": "uuid"
          }
        },
        "required": [
          "value"
        ]
      }
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
pathVariables:
  - key: id
    value: 07c0060e-8e8c-44c1-942c-3004f5a6c5b6
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "format": "uuid"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: json
  content: |-
    {
      "email": "colleague@example.com",
      "role": "editor"
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "user_id": {
          "type": "string",
          "description": "Target user ID if inviting an existing platform user",
          "format": "uuid"
        },
        "email": {
          "type": "string",
          "description": "Target email address if inviting via email",
          "format": "email"
        },
        "role": {
          "type": "string",
          "enum": [
            "viewer",
            "editor",
            "developer",
            "admin",
            "owner"
          ],
          "example": "editor"
        }
      },
      "required": [
        "role"
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Invite member to organization.resources/examples
order: 1000
