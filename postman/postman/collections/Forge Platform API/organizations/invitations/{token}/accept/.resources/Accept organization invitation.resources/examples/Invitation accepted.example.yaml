$kind: http-example
request:
  url: "{{baseUrl}}/organizations/invitations/:token/accept"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    token: inv_tok_12345678
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "string",
        "data": {
          "organization_id": "ac6629d2-e920-5e1c-b74a-51985dd4fa74",
          "user_id": "453d1c24-413d-a801-1ff7-b3b3bf90ed34",
          "email": "YtHXidscI9@mFR.zkwy",
          "role": "admin",
          "joined_at": "1983-03-30T20:55:52.229Z"
        }
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "message": {
            "type": "string"
          },
          "data": {
            "type": "object",
            "properties": {
              "organization_id": {
                "type": "string",
                "format": "uuid"
              },
              "user_id": {
                "type": "string",
                "format": "uuid"
              },
              "email": {
                "type": "string",
                "format": "email"
              },
              "role": {
                "type": "string",
                "enum": [
                  "viewer",
                  "editor",
                  "admin",
                  "owner"
                ]
              },
              "joined_at": {
                "type": "string",
                "format": "date-time"
              }
            }
          }
        }
