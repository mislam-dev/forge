$kind: http-request
description: ""
url: "{{baseUrl}}/organizations"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "name": "Dev Corps",
      "type": "Enterprise",
      "descriptions": "A large enterprise organization"
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "name": {
          "type": "string"
        },
        "type": {
          "type": "string",
          "enum": [
            "Enterprise",
            "Startup",
            "Business"
          ]
        },
        "descriptions": {
          "type": "string"
        },
        "owner_user_id": {
          "type": "string",
          "description": "Optional owner user ID. Required only if Admin is assigning ownership to another user; defaults to authenticated user.",
          "format": "uuid"
        }
      },
      "required": [
        "name",
        "type"
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Response status code is 201 Created or client error (400/401)", function () {
          pm.expect(pm.response.code).to.be.oneOf([201, 400, 401]);
      });

      pm.test("Response Content-Type is application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      let json_data;
      try {
          json_data = pm.response.json();
      } catch (e) {
          pm.expect.fail("Response body is not valid JSON");
      }

      if (pm.response.code === 201) {
          pm.test("Success response conforms to OrganizationResponse schema", function () {
              pm.expect(json_data).to.have.property("data");
              pm.expect(json_data.data).to.be.an("object");
              pm.expect(json_data.data).to.have.property("id");
              pm.expect(json_data.data).to.have.property("name");
              pm.expect(json_data.data).to.have.property("type");
          });

          if (json_data.data && json_data.data.id) {
              pm.environment.set("organization_id", json_data.data.id);
          }
      } else {
          pm.test("Error response conforms to ErrorResponse schema", function () {
              pm.expect(json_data.is_error).to.be.true;
              pm.expect(json_data.code).to.be.a("string");
              pm.expect(json_data.message).to.be.a("string");
          });
      }
    language: text/javascript
settings: {}
examples: ./.resources/Create a new organization.resources/examples
order: 2000
