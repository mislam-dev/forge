$kind: http-example
name: Authorization Denied / Insufficient Privileges
request:
  url: "{{baseUrl}}/access-control/permissions?page=1&per_page=10"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: page
      value: "1"
      disabled: false
      description: Page number for pagination (defaults to 1)
    - key: per_page
      value: "10"
      disabled: false
      description: Number of items per page (defaults to 10)
  body:
    type: text
    content: ""
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "is_error": true,
        "code": "PRJ_PERM_001",
        "message": "Access denied. Viewers cannot perform write operations"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "is_error": {
            "type": "boolean",
            "example": true
          },
          "code": {
            "type": "string",
            "example": "PRJ_PERM_002"
          },
          "message": {
            "type": "string",
            "example": "Access denied. Developers can only delete projects created by themselves."
          },
          "errors": {
            "type": "object"
          }
        }
      }
order: 3000
