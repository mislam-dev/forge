$kind: http-example
name: Resource Conflict / Duplicate Entry
request:
  url: "{{baseUrl}}/access-control/permissions"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "key": "Create User",
        "value": "create-user",
        "descriptions": "Ability to create new users"
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "is_error": true,
        "code": "ENV_002",
        "message": "Duplicate Variable Key for target environment"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "is_error": {
            "type": "boolean",
            "example": true
          },
          "code": {
            "type": "string",
            "example": "PRJ_PERM_002"
          },
          "message": {
            "type": "string",
            "example": "Access denied. Developers can only delete projects created by themselves."
          },
          "errors": {
            "type": "object"
          }
        }
      }
order: 5000
