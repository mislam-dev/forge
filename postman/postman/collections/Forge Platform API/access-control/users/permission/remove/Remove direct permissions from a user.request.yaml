$kind: http-request
description: ""
url: "{{baseUrl}}/access-control/users/permission/remove"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "user_id": "456e7890-e89b-12d3-a456-426614174000",
      "permission_ids": [
        "18d1071f-9f9d-55d2-a53d-4115f6b7d6c7"
      ]
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "user_id": {
          "type": "string",
          "example": "456e7890-e89b-12d3-a456-426614174000",
          "format": "uuid"
        },
        "permission_ids": {
          "type": "array",
          "example": [
            "18d1071f-9f9d-55d2-a53d-4115f6b7d6c7"
          ],
          "items": {
            "type": "string",
            "format": "uuid"
          }
        }
      },
      "required": [
        "user_id",
        "permission_ids"
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Response status code is 200 OK or client error (400/401/403/404)", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 400, 401, 403, 404]);
      });

      pm.test("Response Content-Type is application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      let json_data;
      try {
          json_data = pm.response.json();
      } catch (e) {
          pm.expect.fail("Response body is not valid JSON");
      }

      if (pm.response.code === 200) {
          pm.test("Success response contains message", function () {
              pm.expect(json_data).to.have.property("message");
              pm.expect(json_data.message).to.be.a("string");
          });
      } else {
          pm.test("Error response conforms to ErrorResponse schema", function () {
              pm.expect(json_data.is_error).to.be.true;
              pm.expect(json_data.code).to.be.a("string");
              pm.expect(json_data.message).to.be.a("string");
          });
      }
    language: text/javascript
settings: {}
examples: ./.resources/Remove direct permissions from a user.resources/examples
order: 1000
