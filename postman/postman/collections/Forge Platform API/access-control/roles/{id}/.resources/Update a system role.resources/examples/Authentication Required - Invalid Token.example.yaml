$kind: http-example
name: Authentication Required / Invalid Token
request:
  url: "{{baseUrl}}/access-control/roles/:id"
  method: PATCH
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    id: 07c0060e-8e8c-44c1-942c-3004f5a6c5b6
  body:
    type: json
    content: |-
      {
        "key": "Updated Admin",
        "value": "updated_admin"
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "is_error": true,
        "code": "AUTH_000",
        "message": "Authentication token missing or invalid"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "is_error": {
            "type": "boolean",
            "example": true
          },
          "code": {
            "type": "string",
            "example": "PRJ_PERM_002"
          },
          "message": {
            "type": "string",
            "example": "Access denied. Developers can only delete projects created by themselves."
          },
          "errors": {
            "type": "object"
          }
        }
      }
order: 3000
