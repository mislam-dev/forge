$kind: http-example
name: Bad Request / Validation Failure
request:
  url: "{{baseUrl}}/access-control/roles/permissions/remove"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "role_id": "07c0060e-8e8c-44c1-942c-3004f5a6c5b6",
        "permission_ids": [
          "18d1071f-9f9d-55d2-a53d-4115f6b7d6c7"
        ]
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "is_error": true,
        "code": "ENV_001",
        "message": "Invalid Key Format. Must match POSIX ^[A-Z_][A-Z0-9_]*$"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "is_error": {
            "type": "boolean",
            "example": true
          },
          "code": {
            "type": "string",
            "example": "PRJ_PERM_002"
          },
          "message": {
            "type": "string",
            "example": "Access denied. Developers can only delete projects created by themselves."
          },
          "errors": {
            "type": "object"
          }
        }
      }
order: 2000
