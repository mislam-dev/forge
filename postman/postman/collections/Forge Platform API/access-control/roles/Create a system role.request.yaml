$kind: http-request
description: ""
url: "{{baseUrl}}/access-control/roles"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "key": "System Admin",
      "value": "admin",
      "description": "Full system administrative access"
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "key": {
          "type": "string",
          "example": "System Admin"
        },
        "value": {
          "type": "string",
          "example": "admin"
        },
        "description": {
          "type": "string",
          "example": "Full system administrative access"
        }
      },
      "required": [
        "key",
        "value"
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Response status code is 201 Created or client error (400/401/403/409)", function () {
          pm.expect(pm.response.code).to.be.oneOf([201, 400, 401, 403, 409]);
      });

      pm.test("Response Content-Type is application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      let json_data;
      try {
          json_data = pm.response.json();
      } catch (e) {
          pm.expect.fail("Response body is not valid JSON");
      }

      if (pm.response.code === 201) {
          pm.test("Success response conforms to ApiResponseRoleSingle schema", function () {
              pm.expect(json_data).to.have.property("data");
              pm.expect(json_data.data).to.be.an("object");
              pm.expect(json_data.data).to.have.property("id");
              pm.expect(json_data.data).to.have.property("key");
              pm.expect(json_data.data).to.have.property("value");
          });

          if (json_data.data && json_data.data.id) {
              pm.environment.set("role_id", json_data.data.id);
          }
      } else {
          pm.test("Error response conforms to ErrorResponse schema", function () {
              pm.expect(json_data.is_error).to.be.true;
              pm.expect(json_data.code).to.be.a("string");
              pm.expect(json_data.message).to.be.a("string");
          });
      }
    language: text/javascript
settings: {}
examples: ./.resources/Create a system role.resources/examples
order: 2000
