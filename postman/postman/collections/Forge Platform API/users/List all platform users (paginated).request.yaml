$kind: http-request
description: ""
url: "{{baseUrl}}/users?page=1&per_page=10"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: page
    value: "1"
    disabled: false
    description: Page number for pagination (defaults to 1)
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "integer",
            "default": 1,
            "minimum": 1
          }
        }
      }
  - key: per_page
    value: "10"
    disabled: false
    description: Number of items per page (defaults to 10)
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "integer",
            "default": 10,
            "minimum": 1
          }
        }
      }
body:
  type: text
  content: ""
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Response status code is 200 OK or client error (401/403)", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 401, 403]);
      });

      pm.test("Response Content-Type is application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      let json_data;
      try {
          json_data = pm.response.json();
      } catch (e) {
          pm.expect.fail("Response body is not valid JSON");
      }

      if (pm.response.code === 200) {
          pm.test("Success response conforms to ApiResponsePaginatedUsers schema", function () {
              pm.expect(json_data).to.have.property("data");
              pm.expect(json_data.data).to.be.an("object");
              pm.expect(json_data.data).to.have.property("page");
              pm.expect(json_data.data).to.have.property("per_page");
              pm.expect(json_data.data).to.have.property("total");
              pm.expect(json_data.data).to.have.property("total_pages");
              pm.expect(json_data.data).to.have.property("data");
              pm.expect(json_data.data.data).to.be.an("array");
          });
      } else {
          pm.test("Error response conforms to ErrorResponse schema", function () {
              pm.expect(json_data.is_error).to.be.true;
              pm.expect(json_data.code).to.be.a("string");
              pm.expect(json_data.message).to.be.a("string");
          });
      }
    language: text/javascript
settings: {}
examples: ./.resources/List all platform users (paginated).resources/examples
order: 1000
