$kind: http-example
request:
  url: "{{baseUrl}}/users?page=1&per_page=10"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: page
      value: "1"
      disabled: false
      description: Page number for pagination (defaults to 1)
    - key: per_page
      value: "10"
      disabled: false
      description: Number of items per page (defaults to 10)
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "Users fetched successfully!",
        "data": {
          "page": 1,
          "per_page": 10,
          "total": 100,
          "total_pages": 10,
          "data": [
            {
              "id": "456e7890-e89b-12d3-a456-426614174000",
              "name": "Monirul Islam",
              "email": "monirul@example.com"
            },
            {
              "id": "456e7890-e89b-12d3-a456-426614174000",
              "name": "Monirul Islam",
              "email": "monirul@example.com"
            }
          ]
        }
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "message": {
            "type": "string",
            "example": "Users fetched successfully!"
          },
          "data": {
            "type": "object",
            "properties": {
              "page": {
                "type": "integer",
                "example": 1
              },
              "per_page": {
                "type": "integer",
                "example": 10
              },
              "total": {
                "type": "integer",
                "example": 100
              },
              "total_pages": {
                "type": "integer",
                "example": 10
              },
              "data": {
                "type": "array",
                "items": {
                  "type": "object",
                  "properties": {
                    "id": {
                      "type": "string",
                      "example": "456e7890-e89b-12d3-a456-426614174000",
                      "format": "uuid"
                    },
                    "name": {
                      "type": "string",
                      "example": "Monirul Islam"
                    },
                    "email": {
                      "type": "string",
                      "example": "monirul@example.com",
                      "format": "email"
                    }
                  },
                  "required": [
                    "id",
                    "name",
                    "email"
                  ]
                }
              }
            },
            "required": [
              "page",
              "per_page",
              "total",
              "total_pages",
              "data"
            ]
          }
        },
        "required": [
          "message",
          "data"
        ]
      }
order: 1000
