$kind: http-request
description: ""
url: "{{baseUrl}}/users/:id/profile"
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: id
    value: 07c0060e-8e8c-44c1-942c-3004f5a6c5b6
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "format": "uuid"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: json
  content: |-
    {
      "first_name": "John",
      "last_name": "Doe",
      "phone": "+1234567890",
      "date_of_birth": "1990-01-15",
      "gender": "male",
      "image": "https://storage.example.com/avatars/john.png"
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "first_name": {
          "type": "string",
          "example": "Monirul"
        },
        "last_name": {
          "type": "string",
          "example": "Islam"
        },
        "phone": {
          "type": "string",
          "example": "+1234567890"
        },
        "date_of_birth": {
          "type": "string",
          "example": "1990-01-15",
          "format": "date"
        },
        "gender": {
          "type": "string",
          "enum": [
            "male",
            "female",
            "other"
          ],
          "example": "male"
        },
        "image": {
          "type": "string",
          "example": "https://example.com/avatar.png"
        }
      }
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Response status code is 200 OK or client error (400/401/404)", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 400, 401, 404]);
      });

      pm.test("Response Content-Type is application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      let json_data;
      try {
          json_data = pm.response.json();
      } catch (e) {
          pm.expect.fail("Response body is not valid JSON");
      }

      if (pm.response.code === 200) {
          pm.test("Success response conforms to ApiResponseProfileSingle schema", function () {
              pm.expect(json_data).to.have.property("data");
              pm.expect(json_data.data).to.be.an("object");
              pm.expect(json_data.data).to.have.property("id");
              pm.expect(json_data.data).to.have.property("user_id");
              pm.expect(json_data.data).to.have.property("created_at");
              pm.expect(json_data.data).to.have.property("updated_at");
          });
      } else {
          pm.test("Error response conforms to ErrorResponse schema", function () {
              pm.expect(json_data.is_error).to.be.true;
              pm.expect(json_data.code).to.be.a("string");
              pm.expect(json_data.message).to.be.a("string");
          });
      }
    language: text/javascript
settings: {}
examples: ./.resources/Update user profile.resources/examples
order: 2000
