$kind: http-request
description: "Establishes a persistent Server-Sent Events (SSE) connection to receive real-time notification events. Note: Standard OpenAPI UI tooling (e.g., Swagger UI) does not natively support interactive testing of SSE event streams. Clients must send header 'Accept: text/event-stream'."
url: "{{baseUrl}}/notifications/stream"
method: GET
headers:
  Accept: text/event-stream
body:
  type: text
  content: ""
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Response status code is 200 OK or client error (401)", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 401]);
      });

      if (pm.response.code === 200) {
          pm.test("Response Content-Type is text/event-stream", function () {
              pm.expect(pm.response.headers.get("Content-Type")).to.include("text/event-stream");
          });
      } else {
          let json_data;
          try {
              json_data = pm.response.json();
          } catch (e) {
              pm.expect.fail("Response body is not valid JSON");
          }
          pm.test("Error response conforms to ErrorResponse schema", function () {
              pm.expect(json_data.is_error).to.be.true;
              pm.expect(json_data.code).to.be.a("string");
              pm.expect(json_data.message).to.be.a("string");
          });
      }
    language: text/javascript
settings: {}
examples: ./.resources/Open real-time SSE notification stream.resources/examples
order: 1000
