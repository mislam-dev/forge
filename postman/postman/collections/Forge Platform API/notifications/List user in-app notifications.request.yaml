$kind: http-request
description: ""
url: "{{baseUrl}}/notifications?is_read=true&page=1&limit=10"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: is_read
    value: "true"
    disabled: false
    description: Filter by read/unread status
    $type: boolean
  - key: page
    value: "1"
    disabled: false
    description: Page number for pagination
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "integer",
            "default": 1
          }
        }
      }
  - key: limit
    value: "10"
    disabled: false
    description: Number of items per page
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "integer",
            "default": 10
          }
        }
      }
body:
  type: text
  content: ""
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Response status code is 200 OK or client error (401)", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 401]);
      });

      pm.test("Response Content-Type is application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      let json_data;
      try {
          json_data = pm.response.json();
      } catch (e) {
          pm.expect.fail("Response body is not valid JSON");
      }

      if (pm.response.code === 200) {
          pm.test("Success response conforms to NotificationListResponse schema", function () {
              pm.expect(json_data).to.have.property("data");
              pm.expect(json_data.data).to.be.an("array");
          });
      } else {
          pm.test("Error response conforms to ErrorResponse schema", function () {
              pm.expect(json_data.is_error).to.be.true;
              pm.expect(json_data.code).to.be.a("string");
              pm.expect(json_data.message).to.be.a("string");
          });
      }
    language: text/javascript
settings: {}
examples: ./.resources/List user in-app notifications.resources/examples
order: 1000
