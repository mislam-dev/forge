          }
        },
        "required": [
          "value"
        ]
      }
  - key: Accept
    value: application/json
queryParams:
  - key: organization_id
    value: 1a11e467-74ee-e84f-4cb0-e1363101656f
    disabled: false
    description: Optional organization ID query parameter
    $type: |-
      {
        "type": "object",
        "properties": {
