$kind: http-request
description: ""
url: "{{baseUrl}}/teams?organization_id=1a11e467-74ee-e84f-4cb0-e1363101656f"
method: GET
headers:
  - key: Organization-ID
    value: "{{organization_id}}"
    disabled: false
    description: Organization UUID required in the header for tenant-scoped role-based authorization
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
