$kind: http-request
description: ""
url: "{{baseUrl}}/teams"
method: POST
headers:
  - key: Organization-ID
    value: "{{organization_id}}"
    disabled: false
    description: Organization UUID required in the header for tenant-scoped role-based authorization
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "format": "uuid"
          }
        },
        "required": [
          "value"
        ]
      }
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
      "organization_id": "07c0060e-8e8c-44c1-942c-3004f5a6c5b6",
      "name": "Backend Engineering",
      "descriptions": "Core backend services and API team"
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "organization_id": {
          "type": "string",
          "format": "uuid"
        },
        "name": {
          "type": "string",
          "minLength": 2,
          "maxLength": 255
        },
        "descriptions": {
          "type": "string"
        }
      },
      "required": [
        "organization_id",
        "name"
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Response status code is 201 Created or client error (400/401/403)", function () {
          pm.expect(pm.response.code).to.be.oneOf([201, 400, 401, 403]);
      });

      pm.test("Response Content-Type is application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      let json_data;
      try {
          json_data = pm.response.json();
      } catch (e) {
          pm.expect.fail("Response body is not valid JSON");
      }

      if (pm.response.code === 201) {
          pm.test("Success response conforms to TeamResponse schema", function () {
              pm.expect(json_data).to.have.property("data");
              pm.expect(json_data.data).to.be.an("object");
              pm.expect(json_data.data).to.have.property("id");
              pm.expect(json_data.data).to.have.property("name");
              pm.expect(json_data.data).to.have.property("member_count");
              pm.expect(json_data.data).to.have.property("created_at");
          });

          if (json_data.data && json_data.data.id) {
              pm.environment.set("team_id", json_data.data.id);
          }
      } else {
          pm.test("Error response conforms to ErrorResponse schema", function () {
              pm.expect(json_data.is_error).to.be.true;
              pm.expect(json_data.code).to.be.a("string");
              pm.expect(json_data.message).to.be.a("string");
          });
      }
    language: text/javascript
settings: {}
examples: ./.resources/Create a team.resources/examples
order: 2000
